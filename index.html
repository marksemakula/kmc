<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyawell Medical Center</title>
    
    <!-- Simplified Favicon Configuration -->
    <link rel="icon" href="/Keyawell.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/Keyawell.ico" type="image/x-icon">
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Cinzel:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--
      ──────────────────────────────────────────────────────────────────────────
      Schema.org structured data — site-level (static, lives here in the HTML)
      Page-level schemas (BreadcrumbList etc.) are injected by React components.
      ──────────────────────────────────────────────────────────────────────────
    -->

    <!-- WebSite + SitelinksSearchBox ---------------------------------------->
    <!--
      The SitelinksSearchBox schema asks Google to show an inline search box
      next to our sitelink.  The urlTemplate must point to a real search page;
      we use /blog?q= because the Blog page filters posts by that parameter.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Keyawell Medical Center",
      "url": "https://keyawell.or.ug",
      "description": "Comprehensive healthcare services in Uganda — consultations, specialist care, telemedicine, referrals, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://keyawell.or.ug/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Organization (helps Google build sitelinks for the homepage) -------->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "Keyawell Medical Center",
      "url": "https://keyawell.or.ug",
      "logo": "https://keyawell.or.ug/images/Keyawell.png",
      "description": "Comprehensive healthcare services in Uganda.",
      "telephone": "+256700251453",
      "email": "service@keyawell.or.ug",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "UG"
      },
      "sameAs": [],
      "hasMap": "",
      "medicalSpecialty": [
        "Cardiology",
        "General Practice",
        "Emergency Medicine"
      ]
    }
    </script>

    <!-- SiteNavigationElement — explicit nav links for Google's sitelinks ---->
    <!--
      Listing the main navigation items with SiteNavigationElement gives Google
      strong signals about which pages deserve sitelinks in search results.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Main Navigation",
      "itemListElement": [
        {
          "@type": "SiteLinksSearchBox",
          "url": "https://keyawell.or.ug"
        },
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "url": "https://keyawell.or.ug/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Services",
          "url": "https://keyawell.or.ug/services"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Blog",
          "url": "https://keyawell.or.ug/blog"
        },
        {
          "@type": "ListItem",
          "position": 4,
          "name": "Referral",
          "url": "https://keyawell.or.ug/referral"
        },
        {
          "@type": "ListItem",
          "position": 5,
          "name": "Careers",
          "url": "https://keyawell.or.ug/careers"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
