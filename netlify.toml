[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

# Ensure sitemap and robots are served with correct content types
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Job preview pages must serve HTML with OG/Twitter tags before the SPA fallback.
[[redirects]]
  from = "/job/*"
  to = "/.netlify/functions/job-preview"
  status = 200

# SPA catch-all — static files are served before this rule is evaluated
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200